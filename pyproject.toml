[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-warden"
version = "0.2.0"
description = "Collaborative agents whose tool calls pass through a warden that shares what it blocks"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.38.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "irangareddy"
display-name = "Agent Warden"
color = "emerald"
fab-format-version = 1
flwr-version-target = "1.38.0"
fab-include = ["agent/**/*.py", "agent/rulepacks/**", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
